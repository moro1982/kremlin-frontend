<div class="modal">
    <h3>Declare Influence</h3>

    <input type="number"
        [(ngModel)]="value"
        min="1"
        max="10"
    />

    <div class="modal-buttons">
        <button class="boton" (click)="confirm()">Confirm</button>
        <button class="boton" (click)="close()">Cancel</button>
    </div>
</div>
