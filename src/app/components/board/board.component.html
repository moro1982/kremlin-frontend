<div class="board-layout">

    <div class="board">

        <app-game-header></app-game-header>

        <ng-container *ngIf="gameStore.gameState()">
            <app-phase-control
                [gameID]="gameStore.game()?.id"
                [phaseStatus]="gameStore.phaseStatus()"
                [players]="gameStore.players()"
                [readyPlayers]="gameStore.readyPlayers()"
                [iAmReady]="gameStore.iAmReady()"
                [allPlayersReady]="gameStore.allPlayersReady()"
                (readyClicked)="onReadyClicked()"
                (beginPhaseClicked)="onBeginPhaseClicked()"
                (resolveActionsClicked)="onResolveActionsClicked()"
            >
            </app-phase-control>

            <app-politburo-pyramid
                [ministries]="gameStore.ministries()"
                [politicos]="gameStore.politicos()"
                [playerColorMap]="gameStore.playerColorMap()"
                [declaredInfluencesByPolitico]="gameStore.declaredInfluencesByPolitico()"
                [selectedPoliticoID]="gameStore.ui()?.selectedPoliticoID ?? null"
                (politicoSelected)="onPoliticoSelected($event)"
            >
            </app-politburo-pyramid>
        </ng-container>
        
        <p *ngIf="!gameStore.gameState()" class="no-game">
            No game loaded.
        </p>
    </div>

    <div class="player-panel">
        <div class="side-panel">
            <app-politico-side-panel></app-politico-side-panel>
        
            <app-declare-influence-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM && 
                       modalPayload().actionType === ActionType.DECLARE_INFLUENCE">
            </app-declare-influence-modal>
        
            <app-hospital-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM && 
                       modalPayload().actionType === ActionType.SEND_HOSPITAL">
            </app-hospital-modal>
        </div>
        
        <div class="influence-panel">
            <div class="my-assigned-influence">
                <h3 class="title text-center"> Influence </h3>
                <ul>
                    <div class="influence-table table-header"> 
                        <span>Politico ID</span>
                        <span>Assigned Influence</span>
                    </div>
                    <li class="influence-table" 
                        *ngFor="let influence of myAssignedInfluences()">
                        <div> {{ influence[0] }} </div>
                        <div> {{ influence[1] }} </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    
</div>
