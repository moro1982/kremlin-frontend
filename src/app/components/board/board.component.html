<div class="board-layout">

    <div class="board">

        <app-game-header></app-game-header>

        <ng-container *ngIf="gameStore.gameState()">
            <app-phase-control
                [gameID]="gameStore.game()?.id"
                [awaitingAction]="gameStore.phase()?.awaitingAction ?? undefined"
                [blockingStatus]="gameStore.phase()?.blockingStatus"
                [phaseStatus]="gameStore.phaseStatus()"
                [players]="gameStore.players()"
                [readyPlayers]="gameStore.readyPlayers()"
                [iAmReady]="gameStore.iAmReady()"
                [allPlayersReady]="gameStore.allPlayersReady()"
                (readyClicked)="onReadyClicked()"
                (beginPhaseClicked)="onBeginPhaseClicked()"
                (resolveAwaitingActionClicked)="onResolveAwaitingActionClicked()"
                (resolveActionsClicked)="onResolveActionsClicked()"
            >
            </app-phase-control>

            <app-politburo-pyramid
                [ministries]="gameStore.ministries()"
                [politicos]="gameStore.politicos()"
                [playerColorMap]="gameStore.playerColorMap()"
                [declaredInfluencesByPolitico]="gameStore.declaredInfluencesByPolitico()"
                [selectedPoliticoID]="gameStore.ui()?.selectedPoliticoID ?? null"
                (politicoSelected)="onPoliticoSelected($event)"
            >
            </app-politburo-pyramid>
        </ng-container>
        
        <p *ngIf="!gameStore.gameState()" class="no-game">
            No game loaded.
        </p>
    </div>

    <div class="player-panel">
        <div class="side-panel">
            <app-politico-side-panel></app-politico-side-panel>
        
            <app-declare-influence-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM && 
                       modalPayload().actionType === ActionType.DECLARE_INFLUENCE">
            </app-declare-influence-modal>
        
            <app-hospital-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM && 
                       modalPayload().actionType === ActionType.SEND_HOSPITAL">
            </app-hospital-modal>

            <app-purge-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM &&
                       modalPayload().actionType === ActionType.PURGE_ATTEMPT">
            </app-purge-modal>

            <app-exile-escape-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM &&
                       modalPayload().actionType === ActionType.EXILE_ESCAPE">
            </app-exile-escape-modal>

            <app-investigation-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM &&
                       modalPayload().actionType === ActionType.BEGIN_INVESTIGATION">
            </app-investigation-modal>

            <app-cancel-modal
                *ngIf="modalType() === UiModalType.ACTION_CONFIRM && 
                       modalPayload().actionType === null">
            </app-cancel-modal>
        </div>
        <div class="influence-panel">
            <h3 class="title text-center"> My Assigned Influences </h3>
            <ul>
                <div class="influence-table table-header"> 
                    <span> Politico </span>
                    <span> Assigned Influence </span>
                </div>
                <li class="influence-table" 
                    *ngFor="let influence of myAssignedInfluences()">
                    <div class="cell text-left"> {{ politicos()[Number(influence[0])].name }} </div>
                    <div class="cell text-center"> {{ influence[1] }} </div>
                </li>
            </ul>
        </div>
        <div class="announced-actions">
            <h3 class="title text-center"> Announced Actions </h3>
            <ul>
                <div class="action-table table-header"> 
                    <span> Action Type </span>
                    <span> Target Politico </span>
                    <span> Cancel </span>
                </div>
                <li class="action-table" 
                    *ngFor="let action of announcedActions()"
                >
                    <div class="cell text-left"> 
                        {{ action.type }} 
                    </div>
                    <div class="cell text-center">
                        {{ politicos()[Number(action.targetPoliticoID)].name }} 
                    </div>
                    <button 
                        *ngIf="canCancelAction(action.id)"
                        class="boton"
                        (click)="openCancelActionModal(action.id)"
                    >
                        X
                    </button>
                </li>
            </ul>
        </div>
    </div>
    
</div>
