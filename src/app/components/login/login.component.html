
<div class="login-container">
    <h2 class="login-title">Login</h2>
    <p *ngIf="errorMsg" class="message"> {{ errorMsg }} </p>
    <div class="login-inputs">
        <input type="text" [(ngModel)]="username" placeholder="Usuario" class="login-input">
        <input type="password" [(ngModel)]="password" placeholder="Contraseña">
    </div>
    <button (click)="login()" class="login-btn"> Iniciar sesión </button>
</div>
