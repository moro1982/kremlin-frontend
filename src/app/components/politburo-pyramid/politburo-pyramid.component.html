<div class="pyramid">
    <div class="row top">
        <app-ministry-slot
            *ngFor="let ministry of topLvl"
            [ministry]="ministry"
            [politico]="getPoliticoForMinistry(ministry)"
            [declaredInfluences]="getDeclaredInfluencesByMinister(ministry)"
            [playerColorMap]="playerColorMap"
            [selectedPoliticoID]="selectedPoliticoID"
            (politicoSelected)="onPoliticoSelected($event)"
        >
        </app-ministry-slot>
    </div>

    <div class="row fstLvl">
        <app-ministry-slot
            *ngFor="let ministry of firstLvl"
            [ministry]="ministry"
            [politico]="getPoliticoForMinistry(ministry)"
            [declaredInfluences]="getDeclaredInfluencesByMinister(ministry)"
            [playerColorMap]="playerColorMap"
            [selectedPoliticoID]="selectedPoliticoID"
            (politicoSelected)="onPoliticoSelected($event)"
        >
        </app-ministry-slot>
    </div>

    <div class="row sndLvl">
        <app-ministry-slot
            *ngFor="let ministry of secondLvl"
            [ministry]="ministry"
            [politico]="getPoliticoForMinistry(ministry)"
            [declaredInfluences]="getDeclaredInfluencesByMinister(ministry)"
            [playerColorMap]="playerColorMap"
            [selectedPoliticoID]="selectedPoliticoID"
            (politicoSelected)="onPoliticoSelected($event)"
        >
        </app-ministry-slot>
    </div>

    <div class="row candidates">
        <app-ministry-slot
            *ngFor="let ministry of candidateLvl"
            [ministry]="ministry"
            [politico]="getPoliticoForMinistry(ministry)"
            [declaredInfluences]="getDeclaredInfluencesByMinister(ministry)"
            [playerColorMap]="playerColorMap"
            [selectedPoliticoID]="selectedPoliticoID"
            (politicoSelected)="onPoliticoSelected($event)"
        >
        </app-ministry-slot>
    </div>

    <div class="row people">
        <app-ministry-slot
            *ngFor="let ministry of peopleLvl"
            [ministry]="ministry"
            [politico]="getPoliticoForMinistry(ministry)"
            [declaredInfluences]="getDeclaredInfluencesByMinister(ministry)"
            [playerColorMap]="playerColorMap"
            [selectedPoliticoID]="selectedPoliticoID"
            (politicoSelected)="onPoliticoSelected($event)"
        >
        </app-ministry-slot>
    </div>
</div>

<div class="inactive-states">
    <div class="siberia">
        <h3 class="text-center"> SIBERIA </h3>
        <app-politico-card
            *ngFor="let politico of politicosInSiberia()"
            [politico]="politico"
            [playerColorMap]="playerColorMap"
            [declaredInfluences]="getDeclaredInfluencesByPoliticoID(politico.id)"
            [selected]="politico.id == selectedPoliticoID"
            (selectedChange)="onPoliticoSelected($event)"
        >
        </app-politico-card>
    </div>
    
    <div class="exile">
        <h3 class="text-center"> EXILE </h3>
        <app-politico-card
            *ngFor="let politico of politicosInExile()"
            [politico]="politico"
            [playerColorMap]="playerColorMap"
            [declaredInfluences]="getDeclaredInfluencesByPoliticoID(politico.id)"
            [selected]="politico.id == selectedPoliticoID"
            (selectedChange)="onPoliticoSelected($event)"
        >
        </app-politico-card>
    </div>
</div>
